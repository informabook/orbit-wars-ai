[build-system]
requires = ["setuptools>=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-wars-research"
version = "0.3.1"
description = "Orbit Wars archival research and reproducible local experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{name = "Florent Schobyn"}]
dependencies = ["numpy==2.2.6"]

[project.optional-dependencies]
simulator = ["kaggle-environments==1.30.2"]
analysis = ["matplotlib==3.10.8", "nbformat==5.10.4", "nbclient==0.10.2", "ipykernel==7.1.0"]
test = ["pytest==8.4.2"]

[project.scripts]
orbit-research = "orbit_wars_research.framework.cli:main"
orbit-history = "orbit_wars_research.historical.cli:main"

[tool.setuptools.packages.find]
include = ["orbit_wars_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["simulator: uses the installed official Kaggle simulator"]
